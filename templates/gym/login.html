{% extends "base.html" %}{% block title %}Login | Iron Fitness{% endblock %}{% block content %}<section class="auth-section"><div class="form-card auth-card"><span class="eyebrow">MEMBER LOGIN</span><h1>Welcome back.</h1><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label>{{ field.label }}</label>{{ field }}{{ field.errors }}{% endfor %}<input type="hidden" name="next" value="{{ next }}"><button class="btn btn-primary full" type="submit">Login</button></form><p class="center muted">New here? <a class="text-link" href="{% url 'register' %}">Create an account</a></p></div></section>{% endblock %}
